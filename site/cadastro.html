<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="login">
        <header>
            <img src="https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F9d529295-7920-46d5-adc2-23858d02bbb8/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALSJCdEm8CRtjCG3kaTIgK3DkomBqFX9BeFegqCp_ICJ&exp=1771701323&osig=AAAAAAAAAAAAAAAAAAAAACXbpadQoDlLZ06b-uyJ9NG24i5Yzlz9C4pS_XXEDTfe&signer=media-rpc&x-canva-quality=thumbnail"
                alt="">
            <nav>
                <li>
                    <ul><a href="">HOME</a></ul>
                    <ul><a href="">SOBRE NÓS</a></ul>
                    <ul><a href="">LOGIN</a></ul>
                </li>
            </nav>

        </header>
        <div>
            <div class="conteudo-login">
                <h1>CADASTRO</h1>
                <div class="conteudo-login">
                    <div>
                        <p>Insira um Email:</p>
                        <div class="input-group">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" placeholder="Email">
                        </div>
                    </div>

                    <div>
                        <p>Insira uma senha:</p>
                        <div class="input-group">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" placeholder="Senha">
                        </div>
                    </div>
                    <div>
                        <p>Confirme sua senha:</p>
                        <div class="input-group">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" placeholder="Confirmar senha">
                        </div>
                    </div>


                    <button>CADASTRAR</button>
                </div>



                <a href="">Ja possui uma conta? Realizar login</a>
            </div>
        </div>
    </div>



    <div class="imagem">
        <img src="assets/image/LOGIN.png" alt="">
    </div>




</body>

</html>
