<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="assets/css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div class="login">
      <div class="container">
        <div class="conteudo-login">
        <div class="logo">
          <img src="assets/image/logo_clean-removebg-preview.png" alt="icone">
        </div>
          <h1>CADASTRE-SE</h1>
          <div class="conteudo-log">
            <div>
              <p>Insira um Email:</p>
              <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" placeholder="Email" />
              </div>
            </div>

            <div>
              <p>Insira uma senha:</p>
              <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Senha" />
              </div>
            </div>
            <div>
              <p>Confirme sua senha:</p>
              <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Confirmar senha" />
              </div>
            </div>

            <button>CADASTRAR</button>
          </div>

          <div class="footer"><a class="link" href="login.html">Ja possui uma conta? Realizar login</a>
          <a  class="link" href="./index.html">Voltar à home</a></div>
          
        </div>
      </div>
    </div>

    <div class="imagem">
      <img src="assets/image/LOGIN.png" alt="" />
    </div>
    <div class="logo">
      <img src="assets/image/Logo 1.png" alt="">
    </div>
  </body>
</html>
